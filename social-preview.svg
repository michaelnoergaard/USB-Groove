<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="usbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#grid)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="300" fill="#7b2ff7" opacity="0.03"/>
  <circle cx="1100" cy="150" r="250" fill="#00d2ff" opacity="0.03"/>

  <!-- Sound wave bars (left side, subtle) -->
  <g transform="translate(100, 260)" opacity="0.15">
    <rect x="0" y="30" width="4" height="60" rx="2" fill="#00d2ff"/>
    <rect x="12" y="15" width="4" height="90" rx="2" fill="#00d2ff"/>
    <rect x="24" y="25" width="4" height="70" rx="2" fill="#00d2ff"/>
    <rect x="36" y="5" width="4" height="110" rx="2" fill="#00d2ff"/>
    <rect x="48" y="20" width="4" height="80" rx="2" fill="#00d2ff"/>
    <rect x="60" y="35" width="4" height="50" rx="2" fill="#00d2ff"/>
    <rect x="72" y="10" width="4" height="100" rx="2" fill="#00d2ff"/>
  </g>

  <!-- Sound wave bars (right side, subtle) -->
  <g transform="translate(1180, 260)" opacity="0.15">
    <rect x="0" y="25" width="4" height="70" rx="2" fill="#7b2ff7"/>
    <rect x="12" y="10" width="4" height="100" rx="2" fill="#7b2ff7"/>
    <rect x="24" y="30" width="4" height="60" rx="2" fill="#7b2ff7"/>
    <rect x="36" y="5" width="4" height="110" rx="2" fill="#7b2ff7"/>
    <rect x="48" y="20" width="4" height="80" rx="2" fill="#7b2ff7"/>
    <rect x="60" y="35" width="4" height="50" rx="2" fill="#7b2ff7"/>
    <rect x="72" y="15" width="4" height="90" rx="2" fill="#7b2ff7"/>
  </g>

  <!-- USB Drive Icon -->
  <g transform="translate(440, 200)" filter="url(#glow)">
    <!-- USB body -->
    <rect x="0" y="40" width="120" height="160" rx="8" fill="url(#usbGrad)" opacity="0.9"/>
    <!-- USB connector -->
    <rect x="20" y="0" width="80" height="50" rx="4" fill="#c0c0c0"/>
    <rect x="30" y="8" width="20" height="12" rx="2" fill="#888"/>
    <rect x="70" y="8" width="20" height="12" rx="2" fill="#888"/>
    <!-- LED indicator -->
    <circle cx="60" cy="80" r="6" fill="#00d2ff" opacity="0.9"/>
    <circle cx="60" cy="80" r="3" fill="white" opacity="0.5"/>
    <!-- USB label area -->
    <rect x="15" y="100" width="90" height="40" rx="4" fill="white" opacity="0.15"/>
    <text x="60" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" opacity="0.5">MP3</text>
    <!-- Activity dots -->
    <circle cx="35" cy="160" r="3" fill="#00d2ff" opacity="0.6"/>
    <circle cx="60" cy="160" r="3" fill="#7b2ff7" opacity="0.6"/>
    <circle cx="85" cy="160" r="3" fill="#00d2ff" opacity="0.6"/>
  </g>

  <!-- Music Note -->
  <g transform="translate(640, 190)" filter="url(#glow)">
    <!-- Note stem -->
    <rect x="55" y="0" width="8" height="140" rx="4" fill="url(#noteGrad)"/>
    <!-- Note flag -->
    <path d="M63,0 C63,0 100,10 100,50 C100,80 63,60 63,60" fill="url(#noteGrad)" opacity="0.9"/>
    <!-- Note head -->
    <ellipse cx="40" cy="145" rx="30" ry="22" transform="rotate(-20, 40, 145)" fill="url(#noteGrad)"/>
  </g>

  <!-- Plus sign between USB and Note -->
  <g transform="translate(590, 290)" opacity="0.4">
    <rect x="0" y="12" width="30" height="6" rx="3" fill="white"/>
    <rect x="12" y="0" width="6" height="30" rx="3" fill="white"/>
  </g>

  <!-- Title -->
  <text x="640" y="460" font-family="'SF Pro Display', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">
    USB Groove
  </text>

  <!-- Gradient underline -->
  <rect x="390" y="478" width="500" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="640" y="520" font-family="'SF Pro Display', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#8892b0" text-anchor="middle" letter-spacing="1">
    Plug in. Play music. That's it.
  </text>

  <!-- Platform badges -->
  <g transform="translate(490, 555)">
    <!-- Windows badge -->
    <rect x="0" y="0" width="120" height="32" rx="16" fill="white" opacity="0.08"/>
    <rect x="0" y="0" width="120" height="32" rx="16" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
    <text x="60" y="21" font-family="'SF Pro Display', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8892b0" text-anchor="middle">Windows</text>
  </g>
  <g transform="translate(670, 555)">
    <!-- macOS badge -->
    <rect x="0" y="0" width="120" height="32" rx="16" fill="white" opacity="0.08"/>
    <rect x="0" y="0" width="120" height="32" rx="16" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
    <text x="60" y="21" font-family="'SF Pro Display', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8892b0" text-anchor="middle">macOS</text>
  </g>
</svg>
