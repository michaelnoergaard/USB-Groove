name: Build and Release

# Triggers on every push to main
on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "number=1.$((COUNT - 1))" >> $GITHUB_OUTPUT
          echo "tag=v1.$((COUNT - 1))" >> $GITHUB_OUTPUT

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          rc /fo USBAutoPlayer.res USBAutoPlayer.rc
          cl USBAutoPlayer.cpp `
            /O2 /W4 /EHsc /std:c++17 `
            /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN `
            /link `
            USBAutoPlayer.res `
            winmm.lib shell32.lib user32.lib gdi32.lib kernel32.lib `
            /SUBSYSTEM:WINDOWS `
            /OUT:USBGroove.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: USBGroove.exe

    outputs:
      tag: ${{ steps.version.outputs.tag }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          swiftc macos/USBGroove.swift -o USBGroove \
            -framework AVFoundation \
            -framework DiskArbitration \
            -framework AppKit \
            -O

      - name: Generate macOS icon
        run: |
          mkdir -p AppIcon.iconset
          # Use the 256px icon as base and resize for all iconset slots
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python3 -c "
          from PIL import Image
          src = Image.open('icons/app_256.png')
          sizes = {
              'icon_16x16.png': 16, 'icon_16x16@2x.png': 32,
              'icon_32x32.png': 32, 'icon_32x32@2x.png': 64,
              'icon_128x128.png': 128, 'icon_128x128@2x.png': 256,
              'icon_256x256.png': 256,
          }
          for name, sz in sizes.items():
              src.resize((sz, sz), Image.LANCZOS).save(f'AppIcon.iconset/{name}')
          "
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Create .app bundle
        run: |
          mkdir -p USBGroove.app/Contents/MacOS
          mkdir -p USBGroove.app/Contents/Resources
          cp USBGroove USBGroove.app/Contents/MacOS/USBGroove
          cp AppIcon.icns USBGroove.app/Contents/Resources/AppIcon.icns
          cp icons/StatusBarIconTemplate.png USBGroove.app/Contents/Resources/
          cp icons/StatusBarIconTemplate@2x.png USBGroove.app/Contents/Resources/
          cat > USBGroove.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>USB Groove</string>
              <key>CFBundleDisplayName</key>
              <string>USB Groove</string>
              <key>CFBundleIdentifier</key>
              <string>com.michaelnoergaard.USBGroove</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>USBGroove</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign app bundle
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application: ($APPLE_TEAM_ID)" \
            --timestamp \
            --deep \
            USBGroove.app

      - name: Create zip
        run: |
          ditto -c -k --keepParent USBGroove.app USBGroove-macOS.zip

      - name: Notarize app
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit USBGroove-macOS.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket to the app
          xcrun stapler staple USBGroove.app

          # Re-create the zip with the stapled app
          rm USBGroove-macOS.zip
          ditto -c -k --keepParent USBGroove.app USBGroove-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: USBGroove-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: USB Groove ${{ needs.build-windows.outputs.tag }}
          body: |
            ## USB Groove ${{ needs.build-windows.outputs.tag }}

            Lightweight tray/menu bar app — no installation required.

            ### Downloads
            | Platform | File | Install |
            |----------|------|---------|
            | **Windows** | `USBGroove.exe` | Just download and run |
            | **macOS** | `USBGroove-macOS.zip` | Unzip and move to Applications |

            ### What it does
            - Automatically plays MP3 files from any inserted USB drive
            - Sits in the system tray (Windows) or menu bar (macOS)
            - Controls: Pause, Next, Previous, Shuffle

            ### Package managers
            - **Windows:** `winget install michaelnoergaard.USBGroove`
            - **macOS:** `brew tap michaelnoergaard/usb-groove && brew install usb-groove`
          files: |
            USBGroove.exe
            USBGroove-macOS.zip
          draft: false
          prerelease: false
