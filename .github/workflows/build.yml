name: Build and Release

# Triggers on every push to main
on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "number=1.$((COUNT - 1))" >> $GITHUB_OUTPUT
          echo "tag=v1.$((COUNT - 1))" >> $GITHUB_OUTPUT

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          rc /fo USBAutoPlayer.res USBAutoPlayer.rc
          cl USBAutoPlayer.cpp `
            /O2 /W4 /EHsc /std:c++17 `
            /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN `
            /DAPP_VERSION=${{ steps.version.outputs.number }} `
            /link `
            USBAutoPlayer.res `
            winmm.lib shell32.lib user32.lib gdi32.lib kernel32.lib advapi32.lib `
            /SUBSYSTEM:WINDOWS `
            /OUT:USBGroove.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.number }} installer\USBGroove.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            USBGroove.exe
            USBGroove_Setup_v*.exe

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.number }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "number=1.$((COUNT - 1))" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          swiftc macos/USBGroove.swift -o USBGroove \
            -framework AVFoundation \
            -framework DiskArbitration \
            -framework AppKit \
            -O

      - name: Generate macOS icon
        run: |
          mkdir -p AppIcon.iconset
          # Use the 256px icon as base and resize for all iconset slots
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python3 -c "
          from PIL import Image
          src = Image.open('icons/app_256.png')
          sizes = {
              'icon_16x16.png': 16, 'icon_16x16@2x.png': 32,
              'icon_32x32.png': 32, 'icon_32x32@2x.png': 64,
              'icon_128x128.png': 128, 'icon_128x128@2x.png': 256,
              'icon_256x256.png': 256,
          }
          for name, sz in sizes.items():
              src.resize((sz, sz), Image.LANCZOS).save(f'AppIcon.iconset/{name}')
          "
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Create .app bundle
        run: |
          mkdir -p USBGroove.app/Contents/MacOS
          mkdir -p USBGroove.app/Contents/Resources
          cp USBGroove USBGroove.app/Contents/MacOS/USBGroove
          cp AppIcon.icns USBGroove.app/Contents/Resources/AppIcon.icns
          cp icons/StatusBarIconTemplate.png USBGroove.app/Contents/Resources/
          cp icons/StatusBarIconTemplate@2x.png USBGroove.app/Contents/Resources/
          cat > USBGroove.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>USB Groove</string>
              <key>CFBundleDisplayName</key>
              <string>USB Groove</string>
              <key>CFBundleIdentifier</key>
              <string>com.michaelnoergaard.USBGroove</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.number }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.number }}</string>
              <key>CFBundleExecutable</key>
              <string>USBGroove</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Create zip
        run: |
          ditto -c -k --keepParent USBGroove.app USBGroove-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: USBGroove-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "number=1.$((COUNT - 1))" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libnotify-dev \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall linux/USBGroove.cpp -o USBGroove-Linux \
            -DAPP_VERSION='"${{ steps.version.outputs.number }}"' \
            $(pkg-config --cflags --libs appindicator3-0.1 glib-2.0 gio-2.0 gstreamer-1.0 libnotify) \
            -lstdc++fs

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: USBGroove-Linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ needs.build-windows.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "## Changes"
            echo "${CHANGES}"
            echo ""
            echo "## Downloads"
            echo "| Platform | File | Install |"
            echo "|----------|------|---------|"
            echo "| **Windows** | \`USBGroove.exe\` | Just download and run |"
            echo "| **Windows (Installer)** | \`USBGroove_Setup_v${TAG#v}.exe\` | Start Menu + Add/Remove Programs |"
            echo "| **macOS** | \`USBGroove-macOS.zip\` | Unzip and move to Applications |"
            echo "| **Linux** | \`USBGroove-Linux\` | Download, \`chmod +x\`, and run |"
            echo ""
            echo "## Package managers"
            echo "- **Windows:** \`winget install michaelnoergaard.USBGroove\`"
            echo "- **macOS:** \`brew tap michaelnoergaard/usb-groove && brew install usb-groove\`"
          } > /tmp/release-notes.md

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: USB Groove ${{ needs.build-windows.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            USBGroove.exe
            USBGroove_Setup_v*.exe
            USBGroove-macOS.zip
            USBGroove-Linux
          draft: false
          prerelease: false

      - name: Update winget package
        continue-on-error: true
        if: env.WINGET_PAT != ''
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: michaelnoergaard.USBGroove
          version: ${{ needs.build-windows.outputs.version }}
          installers-regex: '^USBGroove\.exe$'
          token: ${{ secrets.WINGET_PAT }}
